# Plain static-file server for the built React app. `try_files ... /index.html`
# is required for React Router's client-side routes (e.g. /agents/abc123) to
# work on a hard refresh instead of 404ing at the file server level.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
